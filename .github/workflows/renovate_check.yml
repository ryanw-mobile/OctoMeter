name: Renovate Check

on:
  merge_group:
  push:
    branches:
      - 'renovate/**'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # Skips the Gradle/emulator steps below entirely for updates that
      # can't possibly affect the app (GitHub Actions digest bumps, etc.) -
      # so e.g. an action digest bump doesn't pay for a full Gradle build +
      # emulator boot it has no way of affecting. Moved ahead of KVM setup
      # and keystore decoding (per Amazon Q review on #463) so neither
      # unconditionally materializes a decoded secret on disk nor configures
      # KVM when no build/emulator step is going to run.
      - name: Detect build-relevant changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          base: main
          filters: |
            code:
              - 'composeApp/**'
              - 'androidApp/**'
              - 'baselineprofile/**'
              - 'gradle/**'
              - '*.gradle.kts'
              - 'gradle.properties'

      - name: Enable KVM group perms
        if: steps.filter.outputs.code == 'true'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls /dev/kvm

      - name: Decode Keystore
        if: steps.filter.outputs.code == 'true'
        id: decode_keystore
        uses: timheuer/base64-to-file@adaa40c0c581f276132199d4cf60afa07ce60eac # v1.2
        with:
          fileName: 'release.jks'
          encodedString: ${{ secrets.KEYSTORE }}

      - name: Set timezone
        if: steps.filter.outputs.code == 'true'
        run: echo "TZ=Europe/London" >> "$GITHUB_ENV"

      - name: set up JDK 17
        if: steps.filter.outputs.code == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: 'corretto'
          java-version: '17'
          cache: gradle

      - name: Grant execute permission for gradlew
        if: steps.filter.outputs.code == 'true'
        run: chmod +x gradlew

      - name: Prepare RoomDB actual declaration
        if: steps.filter.outputs.code == 'true'
        run: ./gradlew :composeApp:kspCommonMainKotlinMetadata
        env:
          KEYSTORE_LOCATION: ${{ steps.decode_keystore.outputs.filePath }}

      - name: Debug Android Test
        if: steps.filter.outputs.code == 'true'
        run: ./gradlew :androidApp:pixel2Api35DebugAndroidTest -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect -Pandroid.experimental.testOptions.managedDevices.emulator.showKernelLogging=true -Pandroid.experimental.testOptions.managedDevices.maxConcurrentDevices=1 -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=180
        env:
          CI: 'true'
          KEYSTORE_LOCATION: ${{ steps.decode_keystore.outputs.filePath }}

      - name: Install Xvfb
        if: steps.filter.outputs.code == 'true'
        run: sudo apt-get install -y xvfb

      - name: Gradle Check
        if: steps.filter.outputs.code == 'true'
        run: xvfb-run ./gradlew check assembleDebug
        env:
          CI: 'true'
          KEYSTORE_LOCATION: ${{ steps.decode_keystore.outputs.filePath }}

      - name: Upload test report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: test-report
          path: |
            composeApp/build/reports/tests/
            androidApp/build/reports/tests/
